  <script>
    function renderContent() {
      try {
        const raw = document.getElementById('raw-markdown').textContent;
        document.getElementById('content').innerHTML = marked.parse(raw);

        // Handle snake image error gracefully before workflow run
        const snakeImgs = document.querySelectorAll('img[alt*="Snake"], img[alt*="snake"]');
        snakeImgs.forEach(img => {
          img.onerror = () => {
            const fallback = document.createElement('div');
            fallback.className = 'snake-fallback';
            fallback.innerHTML = '⚡ <b>Snake Animation:</b> Once pushed to GitHub, the <code>.github/workflows/snake.yml</code> workflow will automatically generate and animate this grid every 12 hours!';
            img.parentNode.replaceChild(fallback, img);
          };
        });
      } catch (e) {
        console.error(e);
      }
    }
    renderContent();

    function copyMarkdown() {
      const raw = document.getElementById('raw-markdown').textContent.trim();
      navigator.clipboard.writeText(raw).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy README.md'; }, 2000);
      });
    }
  </script>
